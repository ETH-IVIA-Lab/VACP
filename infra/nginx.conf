server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    # The stock mime.types has no entry for the documentation's Markdown views.
    location ~ \.md$ {
        default_type text/markdown;
        charset_types text/markdown;
    }
}
