[tool.uv.workspace]
members = ["packages/python", "evals/plain-mcp", "evals/arena-analysis"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=0.24.0", "ruff>=0.16", "ty>=0.0.82", "pyrefly>=1.3", "basedpyright>=1.40"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["packages/python/tests", "evals/plain-mcp/tests", "evals/arena-analysis/tests"]
addopts = ["-ra", "--import-mode=importlib"]
asyncio_mode = "auto"
markers = ["mcp: MCP-layer tests (no web example smoke tests)"]

[tool.ty.src]
include = ["packages", "evals", "apps", "examples", "tools"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["packages/python/src", "evals/plain-mcp/src", "evals/arena-analysis/src"]

[tool.basedpyright]
include = ["packages", "evals", "apps", "examples", "tools"]
exclude = ["**/node_modules", "**/__pycache__", "**/dist", "**/.venv", "**/.agent-arena"]
extraPaths = ["packages/python/src", "evals/plain-mcp/src", "evals/arena-analysis/src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pyrefly]
project-includes = ["packages/**/*.py", "evals/**/*.py", "apps/**/*.py", "examples/**/*.py", "tools/**/*.py"]
search-path = ["packages/python/src", "evals/plain-mcp/src", "evals/arena-analysis/src"]
python-version = "3.12"
