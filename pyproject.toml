[tool.uv]
required-version = ">=0.13.1"
# Resolve releases at least 18 hours old, matching minimumReleaseAge in pnpm-workspace.yaml.
exclude-newer = "18 hours"

[tool.uv.workspace]
members = ["packages/python"]

[tool.uv.sources]
vacp = { workspace = true }

[dependency-groups]
dev = [
  "vacp[server,http]",
  "pytest>=9",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.16",
  "ty>=0.0.82",
  "pyrefly>=1.3",
  "basedpyright>=1.40",
]
release = ["twine>=6.2"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]
addopts = ["-ra", "--import-mode=importlib"]
asyncio_mode = "auto"
markers = ["mcp: MCP-layer tests (no web example smoke tests)"]

[tool.ty.src]
include = ["packages", "apps", "examples", "tools"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["packages/python/src"]

[tool.basedpyright]
include = ["packages", "apps", "examples", "tools"]
exclude = ["**/node_modules", "**/__pycache__", "**/dist", "**/.venv"]
extraPaths = ["packages/python/src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pyrefly]
project-includes = ["packages/**/*.py", "apps/**/*.py", "examples/**/*.py", "tools/**/*.py"]
search-path = ["packages/python/src"]
python-version = "3.10"
