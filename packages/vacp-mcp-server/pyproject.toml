[project]
name = "vacp-mcp-server"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "fastmcp>=0.4.0",
  "httpx>=0.27.0",
  "playwright>=1.49.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
vacp-mcp-server = "vacp_mcp_server.main:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["mcp: MCP-layer tests (no web example smoke tests)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
