[project]
name = "gemini-computer-use"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "browserbase>=1.4.0",
    "google-genai>=1.40.0",
    "langfuse>=3.12.0",
    "openai>=2.15.0",
    "openinference-instrumentation-google-genai>=0.1.9",
    "playwright>=1.55.0",
    "pydantic>=2.12.0",
    "rich>=13.0.0",
    "termcolor>=3.1.0",
]

[project.scripts]
gemini-computer-use = "gemini_computer_use.main:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "ty>=0.0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
