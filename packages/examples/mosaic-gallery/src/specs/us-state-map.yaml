meta:
  title: U.S. States
  description: >
    A map of U.S. states overlaid with computed centroids.
    The menu provides an agent-controllable way to filter/highlight states.
  credit: Adapted from an [Observable Plot example](https://observablehq.com/@observablehq/plot-state-centroids).
config:
  extensions: spatial
data:
  states:
    type: spatial
    file: data/us-counties-10m.json
    layer: states
params:
  focus: { select: intersect }
vconcat:
  - input: menu
    label: State
    as: $focus
    from: states
    column: name
  - vspace: 8
  - plot:
      - mark: geo
        data: { from: states, filterBy: $focus }
        stroke: currentColor
        strokeWidth: 1
      - mark: dot
        data: { from: states, filterBy: $focus }
        x: { centroidX: geom }
        y: { centroidY: geom }
        r: 2
        fill: steelblue
        tip: true
        title: name
    margin: 0
    projectionType: albers
