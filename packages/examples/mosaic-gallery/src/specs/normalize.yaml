meta:
  title: Normalized Stock Prices
  description: >
    Hover over the chart to normalize the stock prices for the percentage
    return on a given day. The Symbol menu provides an explicit, agent-friendly
    control for filtering series (useful for demonstrating bidirectional state).
data:
  stocks: { file: data/stocks.parquet }
  labels: SELECT MAX(Date) as Date, ARGMAX(Close, Date) AS Close, Symbol
    FROM stocks GROUP BY Symbol
params:
  point: { date: '2013-05-13' }
  symbols: { select: intersect }
vconcat:
  - input: menu
    label: Symbol
    as: $symbols
    from: stocks
    column: Symbol
  - vspace: 10
  - plot:
      - mark: ruleX
        x: $point
      - mark: textX
        x: $point
        text: $point
        frameAnchor: top
        lineAnchor: bottom
        dy: -7
      - mark: text
        data: { from: labels, filterBy: $symbols }
        x: Date
        y: { sql: Close / (SELECT max(Close) FROM stocks WHERE Symbol = source.Symbol AND Date = $point) }
        dx: 2
        text: Symbol
        fill: Symbol
        textAnchor: start
      - mark: lineY
        data: { from: stocks, filterBy: $symbols }
        x: Date
        y: { sql: Close / (SELECT max(Close) FROM stocks WHERE Symbol = source.Symbol AND Date = $point) }
        stroke: Symbol
      - select: nearestX
        as: $point
    yScale: log
    yDomain: [0.2, 6]
    yGrid: true
    xLabel: null
    yLabel: null
    yTickFormat: '%'
    width: 680
    height: 400
    marginRight: 35
