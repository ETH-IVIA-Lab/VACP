<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VACP · Vanilla minimal</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        margin: 0;
        padding: 18px;
        display: grid;
        gap: 12px;
      }
      header {
        display: grid;
        gap: 6px;
        max-width: 860px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p {
        margin: 0;
        color: #334155;
        line-height: 1.35;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        background: #0b1020;
        color: #e7e9ee;
        border: 1px solid rgba(11, 16, 32, 0.25);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
      }
      button.secondary {
        background: white;
        color: #0b1020;
      }
      #app {
        max-width: 860px;
      }
      .card {
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 12px;
        background: white;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .hint {
        font-size: 12px;
        color: #475569;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Vanilla VACP (minimal)</h1>
      <p>
        A single SVG scatterplot, built without a charting framework. Click points to select them. Open
        DevTools to inspect the bridge at <code>window.__vacp</code>.
      </p>
      <div class="row">
        <button id="clear" class="secondary" type="button">Clear selection</button>
      </div>
    </header>
    <div id="app" class="card"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
