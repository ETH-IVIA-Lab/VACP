<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scatterplot with lasso selection</title>
    <style>
      * {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
      }
      body {
        margin: 24px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
      }
      .muted {
        color: #6b7280;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      ul {
        margin: 8px 0 0 18px;
        padding: 0;
      }
      li {
        margin: 4px 0;
      }
      code {
        background: #f3f4f6;
        padding: 1px 6px;
        border-radius: 6px;
      }
      button {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: #fff;
        cursor: pointer;
      }
      #plot {
        width: 100%;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        margin: 12px 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <h2>Scatterplot with lasso selection</h2>
    <p class="muted">Draw a freeform lasso to select points, then use “Clear lasso” to start over.</p>

    <div class="card" style="margin-bottom: 16px">
      <div class="muted" style="margin-bottom: 8px">What to try</div>
      <ul class="muted">
        <li>Draw a lasso polygon with the mouse and watch the selection count update.</li>
        <li>Try selecting different clusters and clearing in between.</li>
      </ul>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="pill muted">
          Selected: <strong class="muted" style="color: inherit"><span id="selected">0</span></strong>
        </div>
        <div class="row">
          <button id="clear" type="button">Clear lasso</button>
        </div>
      </div>
      <div id="plot"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
