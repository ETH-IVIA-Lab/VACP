<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive chart gallery</title>
    <style>
      * {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
      }
      body {
        margin: 24px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
      }
      .muted {
        color: #6b7280;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      ul {
        margin: 8px 0 0 18px;
        padding: 0;
      }
      li {
        margin: 4px 0;
      }
      code {
        background: #f3f4f6;
        padding: 1px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h2>Interactive chart gallery</h2>
    <p class="muted">Pick an example, then explore it by interacting directly with the chart.</p>

    <div class="card" style="margin-bottom: 16px">
      <div class="muted" style="margin-bottom: 8px">What to try</div>
      <ul class="muted">
        <li>Drag a brush in the left chart and watch the right-hand view update.</li>
        <li>Switch examples to see different charts and interactions.</li>
      </ul>
    </div>

    <div class="card">
      <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px">
        <div class="muted" style="min-width: 80px">Example</div>
        <select id="spec" style="flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid #e5e7eb"></select>
      </div>
      <div id="spec-meta" class="muted" style="margin-bottom: 10px"></div>
      <div id="app"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
