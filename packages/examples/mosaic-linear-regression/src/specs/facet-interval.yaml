meta:
  title: Faceted Interval Selections (Penguins)
  description: >
    A faceted scatterplot with a 2D interval selection. This demonstrates how
    a single semantic selection can drive multiple small-multiple views.
data:
  penguins: { file: data/penguins.parquet }
hconcat:
  - name: plot
    plot:
      - mark: frame
      - mark: dot
        data: { from: penguins }
        x: bill_length
        y: bill_depth
        fill: '#aaa'
        r: 1
      - mark: dot
        data: { from: penguins }
        x: bill_length
        y: bill_depth
        fill: species
        fx: sex
        fy: species
      - select: intervalXY
        as: $sel
        brush: { stroke: transparent }
      - select: highlight
        by: $sel
    grid: true
    marginRight: 60
    xDomain: Fixed
    yDomain: Fixed
    fxDomain: Fixed
    fyDomain: Fixed
    fxLabel: null
    fyLabel: null
