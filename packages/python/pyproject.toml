[project]
name = "vacp"
version = "0.1.1"
description = "Python providers and integrations for the Visual Analytics Context Protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.10,<3.15"
keywords = ["visual-analytics", "visualization", "agents", "mcp", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://docs.vacp.dev/"
Documentation = "https://docs.vacp.dev/api/python"
Repository = "https://github.com/ETH-IVIA-Lab/VACP"
Issues = "https://github.com/ETH-IVIA-Lab/VACP/issues"

[project.optional-dependencies]
http = ["starlette>=0.40", "uvicorn>=0.30"]
server = ["fastmcp>=4.1.0", "httpx>=0.27.0", "playwright>=1.49.0", "pydantic>=2.12.0", "starlette>=0.40"]

[project.scripts]
vacp = "vacp.main:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
