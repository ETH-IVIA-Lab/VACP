[project]
name = "vacp-mcp-server"
version = "0.1.0"
description = "MCP server that exposes VACP-enabled web pages to external agents through Playwright"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "fastmcp>=0.4.0",
  "httpx>=0.27.0",
  "playwright>=1.49.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
vacp-mcp-server = "vacp_mcp_server.main:main"

[dependency-groups]
dev = ["pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["mcp: MCP-layer tests (no web example smoke tests)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
