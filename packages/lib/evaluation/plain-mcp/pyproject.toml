[project]
name = "plain-mcp"
version = "0.1.0"
description = "Semantic MCP tools for visual analytics use cases"
readme = "README.md"
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["fastmcp>=3.4.2", "vacp-mcp-server"]

[project.scripts]
plain-mcp = "plain_mcp:main"

[dependency-groups]
dev = ["pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
vacp-mcp-server = { workspace = true }
