[project]
name = "arena-analyis"
version = "0.1.0"
description = "Agent Arena transcript state analysis tooling"
readme = "README.md"
authors = [
    { name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair==6.0.0",
    "duckdb==1.4.4",
    "marimo",
    "openai>=2.0.0",
    "polars==1.38.1",
    "pyarrow==23.0.1",
    "python-dotenv>=1.0.0",
    "sqlglot==28.10.1",
]

[project.scripts]
arena-analyis = "arena_analyis.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
