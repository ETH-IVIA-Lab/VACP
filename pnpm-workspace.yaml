packages:
  - apps/*
  - examples/*
  - evals/*
  - packages/*
catalogMode: prefer
catalog:
  webmcp-types: 0.1.7
  portless: ^0.15.6
  zod: ^4.6.5
  yaml: ^2.9.1
  vite-plus: 0.3.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  '@radix-ui/react-slot': ^1.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-table': ^8.21.3
  '@types/node': ^24.13.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^0.562.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.13
  typescript: ^5.9.3
  zustand: ^5.0.15
overrides:
  yaml: 'catalog:'
  vite: 'catalog:'
  vitepress>vite: ^8.2.0
peerDependencyRules:
  allowedVersions:
    vite: '*'
    vitepress: 2.0.0-alpha.19
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - vite-plus@0.3.3
  - '@voidzero-dev/vite-plus-core@0.3.3'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.3.3'
  - '@voidzero-dev/vite-plus-darwin-x64@0.3.3'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.3'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.3.3'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.3.3'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.3.3'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.3'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.3.3'
verifyDepsBeforeRun: error

publicHoistPattern:
  - vue
  - '@vue/*'
  - '@vueuse/*'
  - vitepress
