packages:
  - apps/*
  - examples/*
  - packages/*
catalogMode: prefer
catalog:
  webmcp-types: 0.1.7
  portless: ^0.15.6
  zod: ^4.6.5
  yaml: ^2.9.1
  vite-plus: 1.0.0-rc.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  '@radix-ui/react-slot': ^1.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-table': ^8.21.3
  '@types/node': ^24.13.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^0.562.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.13
  typescript: ^5.9.3
  zustand: ^5.0.15
  '@types/emscripten': ^1.41.6
  '@babel/core': ^7.29.7
  '@babel/plugin-syntax-jsx': ^7.29.7
  '@babel/plugin-syntax-typescript': ^7.29.7
  '@stylexjs/babel-plugin': 0.19.1
  '@types/babel__core': ^7.20.5
  '@stylexjs/stylex': 0.19.1
  # One DuckDB-Wasm for the workspace, Mosaic's included, so apps ship and load a single engine build.
  '@duckdb/duckdb-wasm': ^1.32.0
overrides:
  '@duckdb/duckdb-wasm': 'catalog:'
  yaml: 'catalog:'
  vite: 'catalog:'
  vitepress>vite: ^8.2.0
peerDependencyRules:
  allowedVersions:
    vite: '*'
    vitepress: 2.0.0-alpha.19
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  protobufjs: true
# Install package releases once they are at least 18 hours old.
minimumReleaseAge: 1080
verifyDepsBeforeRun: error

publicHoistPattern:
  - vue
  - '@vue/*'
  - '@vueuse/*'
  - vitepress
