packages:
  - apps/*
  - examples/*
  - packages/*
catalogMode: prefer
catalog:
  webmcp-types: 0.1.7
  portless: ^0.15.6
  zod: ^4.6.5
  yaml: ^2.9.1
  vite-plus: 1.0.0-rc.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  '@radix-ui/react-slot': ^1.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-table': ^8.21.3
  '@types/node': ^24.13.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^0.562.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.13
  typescript: ^5.9.3
  zustand: ^5.0.15
  '@types/emscripten': ^1.41.6
  '@babel/core': ^7.29.7
  '@babel/plugin-syntax-jsx': ^7.29.7
  '@babel/plugin-syntax-typescript': ^7.29.7
  '@stylexjs/babel-plugin': 0.19.1
  '@types/babel__core': ^7.20.5
  '@stylexjs/stylex': 0.19.1
  # One DuckDB-Wasm for the workspace, Mosaic's included, so apps ship and load a single engine build.
  '@duckdb/duckdb-wasm': ^1.32.0
  # The evals launch the Chromium that `@playwright/test` installs, so both stay on one release.
  playwright: 1.63.0
  '@playwright/test': 1.63.0
  # One AI SDK for the workspace, shared by the product agent and the evals.
  ai: ^7.0.122
  '@ai-sdk/openai-compatible': ^3.0.59
overrides:
  '@duckdb/duckdb-wasm': 'catalog:'
  yaml: 'catalog:'
  vite: 'catalog:'
  vitepress>vite: ^8.2.0
  # The harness adapters pin different ws patches, which splits @ai-sdk/harness into two module instances.
  '@ai-sdk/harness-opencode>ws': 8.22.0
  '@ai-sdk/harness-pi>ws': 8.22.0
peerDependencyRules:
  allowedVersions:
    vite: '*'
    vitepress: 2.0.0-alpha.19
    # Pi's Mistral client accepts the evals' OTLP exporter, one minor ahead of its declared range.
    '@mistralai/mistralai>@opentelemetry/exporter-trace-otlp-http': 0.222.0
allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  protobufjs: true
# Install package releases once they are at least 18 hours old.
minimumReleaseAge: 1080
verifyDepsBeforeRun: error

publicHoistPattern:
  - vue
  - '@vue/*'
  - '@vueuse/*'
  - vitepress
# OpenCode and Pi count input tokens net of cache hits, and their harness adapters report that count
# as the total. The patches report total = uncached + cache reads + cache writes, as AI SDK usage
# defines it, so eval token rows and GenAI spans compare across conditions.
patchedDependencies:
  '@ai-sdk/harness-opencode@1.0.134': patches/@ai-sdk__harness-opencode@1.0.134.patch
  '@ai-sdk/harness-pi@1.0.134': patches/@ai-sdk__harness-pi@1.0.134.patch
