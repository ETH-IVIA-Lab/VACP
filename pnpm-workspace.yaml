packages:
  - docs
  - packages/lib/*/*
  - packages/examples/*
  - packages/testing/*

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@opencode-ai/sdk@1.17.3'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild
  - protobufjs
