name: Set up workspace
description: Install pnpm, Node.js, and the locked JavaScript workspace, and optionally uv and the Python workspace.

inputs:
  python:
    description: Also install uv and the locked Python workspace.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # pnpm reads the pinned pnpm and Node.js releases from devEngines in package.json.
    - name: Set up pnpm and Node.js
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        cache: true
        install: false

    - name: Install JavaScript dependencies
      shell: bash
      run: make setup-web

    # uv reads its minimum release from pyproject.toml and Python from .python-version.
    - name: Set up uv
      if: inputs.python == 'true'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install Python dependencies
      if: inputs.python == 'true'
      shell: bash
      run: make setup-python
