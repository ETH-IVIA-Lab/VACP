name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Every main commit finishes, since the
# image workflow publishes from successful main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run the jobs whose paths they change, as .github/filters.yml defines them.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      documentation: ${{ github.event_name != 'pull_request' || steps.filter.outputs.documentation == 'true' }}
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      build: >-
        ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' ||
        steps.filter.outputs.site == 'true' || steps.filter.outputs.package == 'true' }}
      browser: >-
        ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' ||
        steps.filter.outputs.site == 'true' }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  format:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Check formatting
        run: make format-check

  quality:
    name: Lint and types
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Check formatting, lint rules, and TypeScript types
        run: make lint

      - name: Check Python types
        run: make python-typecheck

      - name: Check unused files, exports, and dependencies
        run: make knip

      - name: Test the lint rules
        run: make test-tools

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Test JavaScript and Python packages
        run: make test

  python:
    name: Python ${{ matrix.python-version }} distributions
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Test wheels and source distributions
        run: make python-test-package PYTHON=${{ matrix.python-version }}

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Build libraries, examples, and docs
        run: make build

      - name: Build Python distributions
        run: make package

      # The browser shards serve these builds, so each one skips the build.
      - name: Upload builds for the browser suite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-builds
          path: |
            packages/*/dist/
            examples/gallery/dist/
            apps/docs/.vitepress/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Browser suite (${{ matrix.shard }}/4)
    needs: [changes, build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Download builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-builds

      - name: Install Chromium
        run: make browser-install

      - name: Run browser shard
        run: make browser-test PLAYWRIGHT_ARGS=--shard=${{ matrix.shard }}/4

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/e2e/blob-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Browser report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true

      - name: Merge shard reports
        run: pnpm --filter @ethivia/vacp-e2e exec playwright merge-reports --reporter html "$RUNNER_TEMP/blob-reports"

      - name: Upload browser report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          if-no-files-found: error
          retention-days: 7

  # The one check branch protection requires. It fails when a job above failed or was cancelled. A job
  # the changed paths leave out reports skipped.
  gate:
    name: CI gate
    if: always()
    needs: [changes, format, quality, test, python, build, e2e, report]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm every selected job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "$failed" >&2
            exit 1
          fi
