name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Every main commit finishes, since the
# image workflow publishes from successful main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Check formatting, lint rules, and TypeScript types
        run: make lint

      - name: Check Python types
        run: make python-typecheck

      - name: Check unused files, exports, and dependencies
        run: make knip

      - name: Test the lint rules
        run: make test-tools

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Test JavaScript and Python packages
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          python: 'true'

      - name: Build libraries, examples, and docs
        run: make build

      - name: Build Python distributions
        run: make package

      # The browser shards serve these builds, so each one skips the build.
      - name: Upload builds for the browser suite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-builds
          path: |
            packages/*/dist/
            examples/gallery/dist/
            docs/.vitepress/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Browser suite (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Download builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-builds

      - name: Install Chromium
        run: make browser-install

      - name: Run browser shard
        run: make browser-test PLAYWRIGHT_ARGS=--shard=${{ matrix.shard }}/4

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/e2e/blob-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Browser report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true

      - name: Merge shard reports
        run: pnpm --filter @vacp/e2e exec playwright merge-reports --reporter html "$RUNNER_TEMP/blob-reports"

      - name: Upload browser report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          if-no-files-found: error
          retention-days: 7

  # The one check branch protection requires. It fails unless every job above succeeded.
  gate:
    name: CI gate
    if: always()
    needs: [quality, test, build, e2e, report]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "$failed" >&2
            exit 1
          fi
