name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.16'
          python-version: '3.12'
          enable-cache: true
      - run: make setup ci
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/python

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: pnpm
      - run: make setup-web browser-install e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          include-hidden-files: true
          path: |
            .artifacts/
            apps/e2e/test-results/
            apps/e2e/playwright-report/
